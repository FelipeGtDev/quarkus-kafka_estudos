quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate
quarkus.http.port=8082
quarkus.rest-client."mx.florinda.notafiscal.PedidoService".url=http://localhost:8080
quarkus.rest-client."mx.florinda.notafiscal.PedidoService".verify-host=false


# Usando o MySQL do docker-compose
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=sua_senha
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/db_nfs

# O Hibernate Reactive precisa da URL reativa explicitamente definida
quarkus.datasource.reactive.url=mysql://localhost:3306/db_nfs