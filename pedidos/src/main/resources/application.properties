quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate

# Usando o MySQL do docker-compose
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=sua_senha
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/seu_banco_pedidos

# O Hibernate Reactive precisa da URL reativa explicitamente definida
quarkus.datasource.reactive.url=mysql://localhost:3306/seu_banco_pedidos
